<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hanoi tower</title>
    <style>
        /* Controls/Logic */
label,
input {
    position: absolute;
    top: -10vmin;
    margin: 0;
    border: 0;
    padding: 0;
    width: 30vmin;
    height: 52.5vmin;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    -webkit-tap-highlight-color: transparent;
}
input:nth-child(6n + 2),
input:checked + input + input + label {
    left: 0;
}
input:nth-child(6n + 3),
input:checked + input + label {
    left: 30vmin;
}
input:nth-child(6n + 4),
input:checked + label {
    left: 60vmin;
}

label,
input:hover,
input[readonly]:focus + input,
input[readonly]:focus + input + input,
input[readonly]:focus + input + input + input {
    pointer-events: initial;
}
input[readonly],
input:nth-child(6n + 2):checked ~ input:nth-child(6n + 2),
input:nth-child(6n + 3):checked ~ input:nth-child(6n + 3),
input:nth-child(6n + 4):checked ~ input:nth-child(6n + 4) {
    pointer-events: none;
}

#one ~ input,
#one ~ label {
    z-index: 3;
}
#two ~ input,
#two ~ label {
    z-index: 2;
}
#three ~ input,
#three ~ label {
    z-index: 1;
}

input#zero {
    z-index: 7;
}
input#zero:focus {
    pointer-events: none;
}
input[readonly]:focus + input:checked ~ #zero {
    left: 0;
    pointer-events: initial;
}
input[readonly]:focus + input + input:checked ~ #zero {
    left: 30vmin;
    pointer-events: initial;
}
input[readonly]:focus + input + input + input:checked ~ #zero {
    left: 60vmin;
    pointer-events: initial;
}

/* Discs */
.discs {
    position: relative;
    display: flex;
    flex-flow: column wrap;
    justify-content: flex-end;
    margin: 10vmin auto 0;
    width: 90vmin;
    height: 35vmin;
}

.disc {
    z-index: 1;
    border-radius: 1vmin;
    height: 4vmin;
    pointer-events: none;
    transition: order 0.3s step-end;
}
input:checked + input + input + label + .disc {
    order: 3;
}
input:checked + input + label + .disc {
    order: 6;
}
input:checked + label + .disc {
    order: 9;
}

input:focus + input:checked + input + input + label + .disc {
    order: 1;
    transition: order 0s;
    animation: float 3s ease-in-out infinite alternate;
}
input:focus + input + input:checked + input + label + .disc {
    order: 4;
    transition: order 0s;
    animation: float 3s ease-in-out infinite alternate;
}
input:focus + input + input + input:checked + label + .disc {
    order: 7;
    transition: order 0s;
    animation: float 3s ease-in-out infinite alternate;
}
@keyframes float {
    50% {
        transform: translateY(-1vmin);
    }
}

input:focus + input:hover + input + input + label + .disc,
input + input:active + input + input + label + .disc {
    order: 1;
}
input:focus + input + input:hover + input + label + .disc,
input + input + input:active + input + label + .disc {
    order: 4;
}
input:focus + input + input + input:hover + label + .disc,
input + input + input + input:active + label + .disc {
    order: 7;
}

.one {
    margin: 0 10vmin;
    width: 10vmin;
    background: linear-gradient(to right, #eea668, #ed7e1d, #e67e22);
}
.two {
    margin: 0 8vmin;
    width: 14vmin;
    background: linear-gradient(to right, #8ac4ea, #0f9fff, #3498db);
}
.three {
    margin: 0 6vmin;
    width: 18vmin;
    background: linear-gradient(to right, #f0d775, #fc0, #e6bd19);
}


/* Spacers/Separators */
.spacer {
    width: 30vmin;
    height: 1px;
    flex-grow: 0;
    pointer-events: none;
    transition: flex 0.3s;
}
.separator {
    width: 0;
    height: 100%;
}
.a {
    order: 2;
}
.ab {
    order: 3;
}
.b {
    order: 5;
}
.bc {
    order: 6;
}
.c {
    order: 8;
}

input[readonly]:focus + input:hover ~ .a,
input[readonly]:focus + input + input:hover ~ .b,
input[readonly]:focus + input + input + input:hover ~ .c {
    transition: flex 0s;
    flex-grow: 1;
}
input[readonly]:focus + input:checked ~ .a,
input[readonly]:focus + input + input:checked ~ .b,
input[readonly]:focus + input + input + input:checked ~ .c {
    flex-grow: 1;
}

/* Winning */
.win {
    z-index: 7;
    position: absolute;
    left: 0;
    right: 0;
    top: -10vmin;
    bottom: -7.5vmin;
    color: #966f33;
    font-family: Arial, sans-serif;
    font-size: 6vmin;
    line-height: 17.5vmin;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}
input:nth-child(6n + 4):checked ~ input:nth-child(6n + 4):checked ~ input:nth-child(6n + 4):checked ~ .win {
    opacity: 1;
    pointer-events: initial;
}
  .lose {
    z-index: 7;
    position: absolute;
    left: 0;
    right: 0;
    top: -10vmin;
    bottom: -7.5vmin;
    color: red;
    font-family: Arial, sans-serif;
    font-size: 6vmin;
    line-height: 17.5vmin;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    text-align: center;
  }
  .lose.show {
    opacity: 1;
    pointer-events: initial;
  }
    #moves-info {
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 3vmin;
      color: rgba(0, 0, 0, 0.6);
    }
  #timer {
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 3vmin;
    color: rgba(0, 0, 0, 0.6);
    margin-top: 1vmin;
  }

/* Everything Else */
body {
    margin: 0;
    background-color: #f8f8f8;
}

h1 {
    margin: 0;
    padding: 5vmin;
    color: rgba(0, 0, 0, 0.5);
    font-family: Arial, sans-serif;
    font-size: 7.5vmin;
    font-weight: lighter;
    text-align: center;
    background: linear-gradient(to right, rgba(150, 111, 51, 0.4), rgba(150, 111, 51, 0.2)),
    repeating-linear-gradient(to right, #eec487, #eec487 3vmin, #f3cf9a 3vmin, #f3cf9a 6vmin, #f8d8a2 6vmin, #f8d8a2 9vmin, #f1ca88 9vmin, #f1ca88 12vmin, #f4d09e 12vmin, #f4d09e 15vmin, #faddb0 15vmin, #faddb0 18vmin, #eec88a 18vmin, #eec88a 21vmin);
}

form {
    text-align: center;
}

.tower {
    position: absolute;
    top: 7.5vmin;
    border-radius: 1vmin;
    width: 5vmin;
    height: 30vmin;
    background: linear-gradient(to right, #d7b889, #b27315, #966f33);
}
.a {
    left: 12.5vmin;
}
.b {
    left: 42.5vmin;
}
.c {
    left: 72.5vmin;
}

.bottom {
    position: relative;
    display: block;
    margin: 0 auto;
    border-radius: 1vmin;
    width: 95vmin;
    height: 7.5vmin;
    background: linear-gradient(to right, rgba(255, 255, 255, 0.3), transparent),
    linear-gradient(#b27315, #966f33 13%, #faddb0 14.5%, #faddb0 27.5%, #966f33 29%, #966f33 42%, #faddb0 43.5%, #d7b889 56.5%, #966f33 58%, #966f33 71%, #d7b889 72.5%, #d7b889 85.5%, #966f33 87%, #b27315);
}

button {
    margin: 7.5vmin auto;
    border: none;
    border-radius: 1vmin;
    width: 35vmin;
    height: 10vmin;
    font-size: 4vmin;
    color: rgba(0, 0, 0, 0.5);
    background: linear-gradient(to right, #c39550, #966f33);
    outline: none;
    cursor: pointer;
    transition: background 0.3s;
}
button:hover {
    background: linear-gradient(to right, #caa163, #a77b39);
}
button:active {
    background: linear-gradient(to right, #cf9844, #9e6f29);
}
    </style>
<script>
  let maxMoves = 15;
  let moves = 0;
  let timeLeft = 60;
  let timerInterval = null;
  let gameEnded = false;

  function updateMovesInfo() {
    const movesInfo = document.getElementById('moves-info');
    movesInfo.textContent = `Moves left: ${maxMoves - moves} | Time: ${formatTime(timeLeft)}`;
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  function showLose() {
    if (gameEnded) return;
    gameEnded = true;
    const loseDiv = document.querySelector('.lose');
    loseDiv.classList.add('show');
  }

  function endGame() {
    gameEnded = true;
    clearInterval(timerInterval);
  }

  function resetGame() {
    moves = 0;
    timeLeft = 60;
    gameEnded = false;
    updateMovesInfo();
    const loseDiv = document.querySelector('.lose');
    loseDiv.classList.remove('show');
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (gameEnded) return;
      timeLeft--;
      updateMovesInfo();
      if (timeLeft <= 0) {
        const winDiv = document.querySelector('.win');
        if (winDiv.style.opacity !== '1' && !winDiv.classList.contains('show')) {
          showLose();
          endGame();
        }
      }
    }, 1000);
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateMovesInfo();
    timerInterval = setInterval(() => {
      if (gameEnded) return;
      timeLeft--;
      updateMovesInfo();
      if (timeLeft <= 0) {
        const winDiv = document.querySelector('.win');
        if (winDiv.style.opacity !== '1' && !winDiv.classList.contains('show')) {
          showLose();
          endGame();
        }
      }
    }, 1000);

    const radios = document.querySelectorAll('input[type="radio"]');
    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (gameEnded) return;
        moves++;
        updateMovesInfo();
        const winDiv = document.querySelector('.win');
        if (winDiv.style.opacity === '1' || winDiv.classList.contains('show')) {
          endGame();
          return;
        }
        if (moves >= maxMoves) {
          const winDiv = document.querySelector('.win');
          if (winDiv.style.opacity !== '1' && !winDiv.classList.contains('show')) {
            showLose();
            endGame();
          }
        }
      });
    });

    const form = document.querySelector('form');
    form.addEventListener('reset', (e) => {
      e.preventDefault();
      resetGame();
      // Also reset the radio buttons to initial checked states
      document.querySelectorAll('input[name="one"]').forEach((input, idx) => input.checked = (idx === 0));
      document.querySelectorAll('input[name="two"]').forEach((input, idx) => input.checked = (idx === 0));
      document.querySelectorAll('input[name="three"]').forEach((input, idx) => input.checked = (idx === 0));
    });
  });
</script>
</head>
<body>
    <h1>Tower of Hanoi</h1>
<form>
    <div class="discs">
        <input id="one" type="text" tabindex="-1" readonly>
        <input name="one" type="radio" tabindex="-1" checked>
        <input name="one" type="radio" tabindex="-1">
        <input name="one" type="radio" tabindex="-1">
        <label for="one"></label>
        <div class="disc one"></div>

        <input id="two" type="text" tabindex="-1" readonly>
        <input name="two" type="radio" tabindex="-1" checked>
        <input name="two" type="radio" tabindex="-1">
        <input name="two" type="radio" tabindex="-1">
        <label for="two"></label>
        <div class="disc two"></div>

        <input id="three" type="text" tabindex="-1" readonly>
        <input name="three" type="radio" tabindex="-1" checked>
        <input name="three" type="radio" tabindex="-1">
        <input name="three" type="radio" tabindex="-1">
        <label for="three"></label>
        <div class="disc three"></div>

        <input id="zero" type="text" tabindex="-1" readonly>

        <div class="spacer a"></div>
        <div class="separator ab"></div>
        <div class="spacer b"></div>
        <div class="separator bc"></div>
        <div class="spacer c"></div>

        <div class="tower a"></div>
        <div class="tower b"></div>
        <div class="tower c"></div>

        <div class="win">You win! :)</div>
        <div class="lose">You Lose 😢</div>
    </div>
    <div class="bottom"></div>
    <button type="reset">New Game</button>
    <div id="moves-info">Moves left: 15 | Time: 1:00</div>
    <div id="timer"></div>
</form>
</body>
</html>
