<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atendo</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
      }

      nav {
        background-color: #3b82f6;
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-around;
        font-size: 18px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 8px 15px;
        border-radius: 5px;
        transition: background-color 0.3s;
      }

      nav a:hover {
        background-color: #2563eb;
      }

      main {
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      section {
        display: none;
      }

      section.active {
        display: block;
      }

      form,
      .table-container {
        margin-bottom: 20px;
      }

      form input,
      form button,
      select {
        margin-bottom: 15px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        width: 100%;
        background-color: #fff;
      }

      .student-list li {
        padding: 12px;
        margin: 8px 0;
        background-color: #e5e7eb;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
      }

      .remove-button {
        background-color: #ef4444;
        color: white;
        padding: 5px 15px;
        font-size: 14px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .remove-button:hover {
        background-color: #dc2626;
      }

      .table-container table {
        width: 100%;
        border-collapse: collapse;
      }

      .table-container th,
      .table-container td {
        padding: 12px;
        text-align: left;
        border: 1px solid #ddd;
      }

      .table-container th {
        background-color: #3b82f6;
        color: white;
      }

      .attendance-list div {
        padding: 10px;
        background-color: #f3f4f6;
        margin: 10px 0;
        border-radius: 8px;
      }

      .attendance-list label {
        margin-left: 15px;
      }

      /* Enhanced Button Styles */
      .mark-attendance-btn {
        background-color: #10b981;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin: 15px 0;
      }

      .mark-attendance-btn:hover {
        background-color: #059669;
      }

      .remove-history-btn {
        background-color: #f59e0b;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 0.3s;
      }

      .remove-history-btn:hover {
        background-color: #d97706;
      }

      .download-excel-btn {
        background-color: #3b82f6;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        /* border-radius: 8px; */
        transition: background-color 0.3s;
      }

      .download-excel-btn:hover {
        background-color: #2563eb;
      }

      .filter-button {
        background-color: #9333ea;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .filter-button:hover {
        background-color: #7e22ce;
      }

      .overview-button {
        background-color: #3b82f6;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .overview-button:hover {
        background-color: #2563eb;
      }

      .print-overview-btn {
        background-color: #ef4444;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .print-overview-btn:hover {
        background-color: #dc2626;
      }

      /* Edit Button Styles */
      .edit-button {
        background-color: #4caf50; /* Green background */
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.3s ease;
        font-weight: bold;
      }

      .edit-button:hover {
        background-color: #45a049; /* Darker green on hover */
        transform: scale(1.05); /* Slight scaling effect for interactivity */
      }

      .download-excel-btn {
        background-color: #3b82f6;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 0.3s;
      }

      .download-excel-btn:hover {
        background-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#" data-page="home">Home</a>
      <a href="#" data-page="attendance">Take Attendance</a>
      <a href="#" data-page="history">History</a>
    </nav>

    <main>
      <!-- Home Section -->
      <section id="home" class="active">
        <h2>Add Students</h2>
        <form id="addStudentForm">
          <input
            type="text"
            id="studentName"
            placeholder="Enter Student Name"
            required
          />
          <input
            type="text"
            id="rollNumber"
            placeholder="Enter Roll Number"
            required
          />
          <input
            type="text"
            id="subject"
            placeholder="Enter Subject"
            required
          />
          <button type="submit">Add Student</button>
        </form>
        <ul id="studentList" class="student-list"></ul>
      </section>

      <!-- Attendance Section -->
      <section id="attendance">
        <h2>Take Attendance</h2>
        <label for="attendanceSubjectFilter">Filter by Subject: </label>
        <select id="attendanceSubjectFilter">
          <option value="">Select Subject</option>
        </select>
        <button class="filter-button" id="filterAttendanceButton">
          Filter
        </button>
        <button class="download-excel-btn" id="downloadTodayButton">
          Download Today's Attendance
        </button>
        <div id="attendanceList" class="attendance-list"></div>
      </section>

      <!-- History Section -->
      <section id="history">
        <h2>Attendance History</h2>
        <label for="subjectFilter">Filter by Subject: </label>
        <select id="subjectFilter">
          <option value="">Select Subject</option>
        </select>
        <button class="filter-button" id="filterHistoryButton">Filter</button>
        <button class="overview-button" id="generateOverviewButton">
          Generate Overview
        </button>
        <button class="download-excel-btn" id="downloadExcelButton">
          Download Overview (Excel)
        </button>
        <button class="remove-history-btn" id="clearHistoryButton">
          Clear All History
        </button>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Roll Number</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Status</th>
                <th>Edit</th>
              </tr>
            </thead>
            <tbody id="historyTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.1/package/dist/xlsx.full.min.js"></script>
    <script>
      // Navigation
      document.querySelectorAll("nav a").forEach((link) => {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          document
            .querySelectorAll("section")
            .forEach((section) => section.classList.remove("active"));
          document
            .getElementById(this.getAttribute("data-page"))
            .classList.add("active");
        });
      });

      // Load data from localStorage if available
      let students = JSON.parse(localStorage.getItem("students")) || [];
      let attendanceRecords =
        JSON.parse(localStorage.getItem("attendanceRecords")) || [];
      let subjects = new Set(students.map((student) => student.subject));

      // Save data to localStorage
      function saveData() {
        localStorage.setItem("students", JSON.stringify(students));
        localStorage.setItem(
          "attendanceRecords",
          JSON.stringify(attendanceRecords)
        );
      }

      // Update UI
      function updateUI() {
        const studentList = document.getElementById("studentList");
        const attendanceList = document.getElementById("attendanceList");
        const historyTable = document.getElementById("historyTable");
        const subjectFilter = document.getElementById("subjectFilter");
        const attendanceSubjectFilter = document.getElementById(
          "attendanceSubjectFilter"
        );

        // Update student list
        studentList.innerHTML = students
          .map(
            (student, index) => `
                <li>
                    ${student.name} (${student.rollNumber}) - ${student.subject}
                    <button class="remove-button" onclick="removeStudent(${index})">Remove</button>
                </li>
            `
          )
          .join("");

        // Update attendance options
        attendanceList.innerHTML = students
          .filter(
            (student) =>
              !attendanceSubjectFilter.value ||
              student.subject === attendanceSubjectFilter.value
          )
          .map(
            (student) => `
                    <div>
                        <label>${student.name} (${student.rollNumber}) - ${student.subject}</label>
                        <button onclick="markAttendance('${student.name}', 'present')">Present</button>
                        <button onclick="markAttendance('${student.name}', 'absent')">Absent</button>
                    </div>
                `
          )
          .join("");

        // Update history table with edit button
        historyTable.innerHTML = attendanceRecords
          .map(
            (record, index) => `
                <tr>
                    <td>${record.student}</td>
                    <td>${record.rollNumber}</td>
                    <td>${record.subject}</td>
                    <td>${record.date}</td>
                    <td>${record.status}</td>
                    <td><button onclick="editHistory(${index})">Edit</button></td>
                </tr>
            `
          )
          .join("");

        // Update subject filter dropdowns
        const subjectsArray = [...subjects];
        subjectFilter.innerHTML = `<option value="">Select Subject</option>${subjectsArray
          .map((subject) => `<option value="${subject}">${subject}</option>`)
          .join("")}`;
        attendanceSubjectFilter.innerHTML = `<option value="">Select Subject</option>${subjectsArray
          .map((subject) => `<option value="${subject}">${subject}</option>`)
          .join("")}`;
      }

      // Add student
      document
        .getElementById("addStudentForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const name = document.getElementById("studentName").value;
          const rollNumber = document.getElementById("rollNumber").value;
          const subject = document.getElementById("subject").value;
          students.push({ name, rollNumber, subject });
          subjects.add(subject); // Add the subject to the subjects set
          saveData();
          updateUI();
          document.getElementById("addStudentForm").reset();
        });

      // Mark attendance
      function markAttendance(studentName, status) {
        const date = new Date().toLocaleDateString();
        const student = students.find((s) => s.name === studentName);
        attendanceRecords.push({
          student: student.name,
          rollNumber: student.rollNumber,
          subject: student.subject,
          date: date,
          status: status,
        });
        saveData();
        updateUI();
      }

      // Remove student
      function removeStudent(index) {
        students.splice(index, 1);
        saveData();
        updateUI();
      }

      // Edit attendance history record
      function editHistory(index) {
        const record = attendanceRecords[index];
        const newStatus = prompt(
          "Edit status (present/absent):",
          record.status
        );
        if (newStatus === "present" || newStatus === "absent") {
          attendanceRecords[index].status = newStatus;
          saveData();
          updateUI();
        }
      }

      // Filter history by subject
      document
        .getElementById("filterHistoryButton")
        .addEventListener("click", function () {
          const subject = document.getElementById("subjectFilter").value;
          const filteredRecords = attendanceRecords.filter((record) =>
            record.subject.toLowerCase().includes(subject.toLowerCase())
          );
          document.getElementById("historyTable").innerHTML = filteredRecords
            .map(
              (record) => `
                <tr>
                    <td>${record.student}</td>
                    <td>${record.rollNumber}</td>
                    <td>${record.subject}</td>
                    <td>${record.date}</td>
                    <td>${record.status}</td>
                    <td><button onclick="editHistory(${attendanceRecords.indexOf(
                      record
                    )})">Edit</button></td>
                </tr>
            `
            )
            .join("");
        });

      // Download Overview as Excel
      document
        .getElementById("downloadExcelButton")
        .addEventListener("click", function () {
          const overview = students.map((student) => {
            const attendance = attendanceRecords.filter(
              (record) => record.student === student.name
            );
            const presentCount = attendance.filter(
              (record) => record.status === "present"
            ).length;
            const absentCount = attendance.filter(
              (record) => record.status === "absent"
            ).length;
            return {
              Name: student.name,
              "Present Count": presentCount,
              "Absent Count": absentCount,
            };
          });
          // Download Today's Attendance
          document
            .getElementById("downloadTodayButton")
            .addEventListener("click", function () {
              const today = new Date().toLocaleDateString(); // Get today's date
              const todayRecords = attendanceRecords.filter(
                (record) => record.date === today
              );

              if (todayRecords.length === 0) {
                alert("No attendance records found for today!");
                return;
              }

              // Create worksheet and workbook using SheetJS
              const ws = XLSX.utils.json_to_sheet(todayRecords);
              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(
                wb,
                ws,
                `Attendance_${today.replace(/\//g, "-")}`
              );
              XLSX.writeFile(
                wb,
                `Attendance_${today.replace(/\//g, "-")}.xlsx`
              );
            });

          const ws = XLSX.utils.json_to_sheet(overview);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Overview");
          XLSX.writeFile(wb, "attendance_overview.xlsx");
        });

      // Clear all history
      document
        .getElementById("clearHistoryButton")
        .addEventListener("click", function () {
          attendanceRecords = [];
          saveData();
          updateUI();
        });

      // Initialize UI with stored data
      updateUI();
    </script>
  </body>
</html>
